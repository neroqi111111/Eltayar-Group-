<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Eltayar Group | Request Admin</title><style>:root{color-scheme:dark;--bg:#08090c;--panel:#11141b;--line:#282d38;--gold:#d7b35a;--muted:#a7adba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#191b20,var(--bg) 65%);color:#f3f4f6;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1200px;margin:0 auto;padding:28px 18px}h1,h2{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}input,button,select{font:inherit;border-radius:8px;padding:10px;border:1px solid var(--line);background:#090b10;color:#fff}input{width:100%;margin:5px 0 12px}button{cursor:pointer;border-color:var(--gold);color:var(--gold)}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hidden{display:none!important}.status{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold)}td small{color:var(--muted);display:block;max-width:320px;white-space:pre-wrap;overflow-wrap:anywhere}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.danger{color:#ff8c8c}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script></head><body><main class="wrap"><div class="top"><div><p>ELTAYAR GROUP / PRIVATE</p><h1>Request Control Center</h1></div><a href="index.html" style="color:var(--gold)">Open public site ↗</a></div><section class="panel" id="login"><h2>Administrator sign in</h2><p class="status">Only accounts manually authorized in the database can view requests.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="sign-in">Sign in</button><p class="status" id="login-status" role="status"></p></section><section class="panel hidden" id="dashboard"><div class="top"><div><h2>Project requests</h2><p class="status" id="count">Loading…</p></div><div><button id="refresh">Refresh</button> <button id="sign-out">Sign out</button></div></div><p class="status" id="dash-status" role="status"></p><div class="tablewrap"><table><thead><tr><th>Received / Ref</th><th>Customer</th><th>Package</th><th>Details</th><th>Status</th><th>Action</th></tr></thead><tbody id="requests"></tbody></table></div></section></main><script>
(function(){const cfg=window.ELTAYAR_CONFIG||{};const $=id=>document.getElementById(id);let client=null;const statuses=['new','reviewing','quoted','in_progress','completed','cancelled'];function msg(id,s){$(id).textContent=s}function setup(){if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey||cfg.supabaseUrl.includes('YOUR_PROJECT')||cfg.supabaseAnonKey.includes('YOUR_')){msg('login-status','Configure assets/js/config.js first, then deploy the SQL schema and Edge Function.');$('sign-in').disabled=true;return false}client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);return true}async function load(){msg('dash-status','Loading requests…');const {data,error}=await client.from('project_requests').select('*').order('created_at',{ascending:false}).limit(200);if(error){msg('dash-status','Could not load requests: '+error.message);return}const body=$('requests');body.replaceChildren();(data||[]).forEach(r=>{const tr=document.createElement('tr');const cell=(text)=>{const td=document.createElement('td');td.textContent=text||'—';return td};const ref=cell(new Date(r.created_at).toLocaleString()+'
'+r.reference_code);const who=cell(r.customer_name);const small=document.createElement('small');small.textContent=(r.email||'')+(r.phone?'
'+r.phone:'')+'
Preferred: '+(r.preferred_contact||'email');who.appendChild(small);const pkg=cell(r.package_name);const details=cell('');const detail=document.createElement('small');detail.textContent=r.project_details+(r.launch_discount?'

Launch discount requested: yes':'');details.appendChild(detail);const st=cell('');const sel=document.createElement('select');statuses.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s.replace('_',' ');o.selected=s===r.status;sel.appendChild(o)});st.appendChild(sel);const act=cell('');const save=document.createElement('button');save.textContent='Save';save.addEventListener('click',async()=>{save.disabled=true;const {error}=await client.from('project_requests').update({status:sel.value}).eq('id',r.id);save.disabled=false;if(error){msg('dash-status','Update failed: '+error.message)}else{msg('dash-status','Status updated for '+r.reference_code);await load()}});act.appendChild(save);[ref,who,pkg,details,st,act].forEach(td=>tr.appendChild(td));body.appendChild(tr)});msg('count',(data||[]).length+' request(s) shown — latest 200');msg('dash-status',data&&data.length?'':'No requests yet.')} $('sign-in').addEventListener('click',async()=>{if(!client&&!setup())return;msg('login-status','Signing in…');const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){msg('login-status','Sign-in failed: '+error.message);return}const {data:auth}=await client.auth.getUser();const {data:admin,error:roleError}=await client.from('admin_users').select('user_id').eq('user_id',auth.user.id).maybeSingle();if(roleError||!admin){await client.auth.signOut();msg('login-status','This account is not authorized as an administrator. Add its UUID to admin_users using the SQL instructions.');return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()});$('refresh').addEventListener('click',load);$('sign-out').addEventListener('click',async()=>{await client.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');msg('login-status','Signed out.')});setup();})();
</script></body></html>
